<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CENDITEL</title>
    <style>
        /* Estilos base para eliminar márgenes y configurar fuentes */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Configuración del cuerpo del documento */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #FFFFFF; /* Fondo blanco */
            overflow: hidden;
        }

        /* Contenedor del fondo de partículas */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1; /* Colocar el fondo detrás del contenido principal */
            background-color: #FFFFFF; /* Fondo blanco */
        }

        /* Contenedor principal de la presentación */
        .container {
            position: relative;
            width: 1625px;
            height: 915px;
            max-width: 1800px;
            max-height: 1200px;
            overflow: hidden;
            border-radius: 8px;
            background-color: #FFFFFF;
            box-shadow: 0 5px 100px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }

        /* Configuración de las láminas individuales */
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            visibility: hidden;
        }

        /* Regla para adaptar la imagen al contenedor */
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;     /* Ajusta la imagen completa sin deformarla ni recortarla */
        }

        /* Clase para la lámina activa */
        .slide.active {
            visibility: visible;
        }

        .slide.transition-in {
            z-index: 2;
        }

        .slide.transition-out {
            z-index: 1;
            visibility: visible;
        }

        /* Duración de animaciones */
        .slide.transition-slide-in { animation: slide-in 1.5s ease-in-out both; }
        .slide.transition-slide-out { animation: slide-out 1.5s ease-in-out both; }
        .slide.transition-fade-in { animation: fade-in 1.5s ease-in-out both; }
        .slide.transition-fade-out { animation: fade-out 1.5s ease-in-out both; }
        .slide.transition-zoom-in { animation: zoom-in 1.5s ease-in-out both; }
        .slide.transition-zoom-out { animation: zoom-out 1.5s ease-in-out both; }
        .slide.transition-vertical-in { animation: vertical-in 1.5s ease-in-out both; }
        .slide.transition-vertical-out { animation: vertical-out 1.5s ease-in-out both; }
        .slide.transition-rotate-in { animation: rotate-in 1.5s ease-in-out both; }
        .slide.transition-rotate-out { animation: rotate-out 1.5s ease-in-out both; }

        @keyframes slide-in {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        @keyframes slide-out {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fade-out {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        @keyframes zoom-in {
            from { opacity: 0; transform: scale(0.7); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes zoom-out {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(1.3); }
        }

        @keyframes vertical-in {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        @keyframes vertical-out {
            from { transform: translateY(0); }
            to { transform: translateY(-100%); }
        }

        @keyframes rotate-in {
            from { opacity: 0; transform: translateX(50%) rotate(12deg) scale(0.8); }
            to { opacity: 1; transform: translateX(0) rotate(0) scale(1); }
        }

        @keyframes rotate-out {
            from { opacity: 1; transform: translateX(0) rotate(0) scale(1); }
            to { opacity: 0; transform: translateX(-50%) rotate(-12deg) scale(0.8); }
        }

        /* Estilo de los encabezados y párrafos */
        .slide h1 { font-size: 2em; margin-bottom: 20px; color: #000000; }
        .slide p { font-size: 1.2em; color: #000000; padding: 0 20px; }

        /* Media query para pantallas pequeñas */
        @media (max-width: 768px) {
            .container {
                max-width: 100%;
                max-height: 80%;
            }
            .slide h1 { font-size: 1.5em; }
            .slide p { font-size: 1em; }
        }
    </style>
</head>
<body>
    <!-- Contenedor de partículas de fondo -->
    <div id="particles-js"></div>

    <!-- Contenedor principal donde se inyectarán las láminas automáticamente -->
    <div class="container" id="slides-container">
        <!-- Se genera de forma dinámica mediante JavaScript -->
    </div>

    <!-- Script de particles.js -->
    <script src="particles.min.js"></script>
    <script>
        // Configuración de particles.js
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 100, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#000000" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5 },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#000000", "opacity": 0.4, "width": 1 },
                "move": { "enable": true, "speed": 3 }
            },
            "interactivity": {
                "events": {
                    "onhover": { "enable": true, "mode": "repulse" },
                    "onclick": { "enable": true, "mode": "push" }
                }
            },
            "retina_detect": true
        });

        // Variables globales de control
        let currentSlide = 1;
        let totalSlides = 0;
        const transitionEffects = ['slide', 'fade', 'zoom', 'vertical', 'rotate'];
        let previousEffect = null;
        let transitionTimeout;

        // Función para detectar cuántas imágenes existen en la carpeta static
        async function detectSlides() {
            const container = document.getElementById('slides-container');
            let i = 1;

            while (true) {
                const imagePath = `static/${i}.png`;
                const exists = await checkImageExists(imagePath);

                if (!exists) {
                    break; // Si la imagen no existe, detenemos la búsqueda
                }

                // Creamos el elemento div.slide y su imagen correspondiente
                const slideDiv = document.createElement('div');
                slideDiv.id = `slide-${i}`;
                slideDiv.className = `slide ${i === 1 ? 'active' : ''}`;

                const img = document.createElement('img');
                img.src = imagePath;
                img.alt = `Lámina ${i}`;

                slideDiv.appendChild(img);
                container.appendChild(slideDiv);

                i++;
            }

            totalSlides = i - 1;
            console.log(`Se detectaron ${totalSlides} láminas automáticamente.`);
        }

        // Utilidad para verificar si una imagen carga correctamente
        function checkImageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        // Muestra la lámina especificada y oculta las demás
        function showSlide(slideNumber) {
            const slides = document.querySelectorAll('.slide');
            if (slides.length === 0) return;

            const outgoingSlide = document.querySelector('.slide.active');
            const incomingSlide = document.querySelector(`#slide-${slideNumber}`);

            if (!outgoingSlide || !incomingSlide) return;

            const effectOptions = transitionEffects.filter(effect => effect !== previousEffect);
            const effect = effectOptions[Math.floor(Math.random() * effectOptions.length)];

            clearTimeout(transitionTimeout);
            slides.forEach(slide => {
                slide.classList.remove(
                    'transition-in',
                    'transition-out',
                    ...transitionEffects.map(name => `transition-${name}-in`),
                    ...transitionEffects.map(name => `transition-${name}-out`)
                );
            });

            outgoingSlide.classList.remove('active');
            outgoingSlide.classList.add('transition-out', `transition-${effect}-out`);
            incomingSlide.classList.add('active', 'transition-in', `transition-${effect}-in`);
            previousEffect = effect;

            transitionTimeout = setTimeout(() => {
                outgoingSlide.classList.remove('transition-out', `transition-${effect}-out`);
                incomingSlide.classList.remove('transition-in', `transition-${effect}-in`);
            }, 1500);
        }

        // Avanza a la siguiente lámina
        function nextSlide() {
            if (totalSlides === 0) return;
            currentSlide = currentSlide < totalSlides ? currentSlide + 1 : 1;
            showSlide(currentSlide);
        }

        // Retrocede a la lámina anterior
        function previousSlide() {
            if (totalSlides === 0) return;
            currentSlide = currentSlide > 1 ? currentSlide - 1 : totalSlides;
            showSlide(currentSlide);
        }

        // Controla las teclas de navegación del teclado
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowRight' || event.key === ' ' || event.key === 'Enter') {
                nextSlide();
                event.preventDefault();
            } else if (event.key === 'ArrowLeft') {
                previousSlide();
            }
        });

        // Inicializar la detección y carga automática al cargar la página
        window.addEventListener('DOMContentLoaded', async () => {
            await detectSlides();
        });
    </script>
</body>
</html>
