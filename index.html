<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación con fondo de partículas</title>
    <style>
        /* Estilos base para eliminar márgenes y configurar fuentes */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Configuración del cuerpo del documento */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #FFFFFF; /* Fondo blanco */
            overflow: hidden;
        }

        /* Contenedor del fondo de partículas */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1; /* Colocar el fondo detrás del contenido principal */
            background-color: #FFFFFF; /* Fondo blanco *//
        }

        /* Contenedor principal de la presentación */
        .container {
            position: relative;
            width: 1625px;
            height: 915px;
            max-width: 1800px;
            max-height: 1200px;
            overflow: hidden;
            border-radius: 8px;
            background-color: #FFFFFF;
            box-shadow: 0 5px 100px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }

        /* Configuración de las láminas individuales */
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            visibility: hidden;
        }

        /* Regla para adaptar la imagen de 1200x676px al contenedor */
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;     /* Ajusta la imagen completa sin deformarla ni recortarla */
        }

        /* Clase para la lámina activa */
        .slide.active {
            visibility: visible;
        }

        .slide.transition-in {
            z-index: 2;
        }

        .slide.transition-out {
            z-index: 1;
            visibility: visible;
        }

        .slide.transition-slide-in {
            animation: slide-in 0.5s ease-in-out both;
        }

        .slide.transition-slide-out {
            animation: slide-out 0.5s ease-in-out both;
        }

        .slide.transition-fade-in {
            animation: fade-in 0.5s ease-in-out both;
        }

        .slide.transition-fade-out {
            animation: fade-out 0.5s ease-in-out both;
        }

        .slide.transition-zoom-in {
            animation: zoom-in 0.5s ease-in-out both;
        }

        .slide.transition-zoom-out {
            animation: zoom-out 0.5s ease-in-out both;
        }

        .slide.transition-vertical-in {
            animation: vertical-in 0.5s ease-in-out both;
        }

        .slide.transition-vertical-out {
            animation: vertical-out 0.5s ease-in-out both;
        }

        .slide.transition-rotate-in {
            animation: rotate-in 0.5s ease-in-out both;
        }

        .slide.transition-rotate-out {
            animation: rotate-out 0.5s ease-in-out both;
        }

        @keyframes slide-in {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        @keyframes slide-out {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fade-out {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        @keyframes zoom-in {
            from { opacity: 0; transform: scale(0.7); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes zoom-out {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(1.3); }
        }

        @keyframes vertical-in {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        @keyframes vertical-out {
            from { transform: translateY(0); }
            to { transform: translateY(-100%); }
        }

        @keyframes rotate-in {
            from { opacity: 0; transform: translateX(50%) rotate(12deg) scale(0.8); }
            to { opacity: 1; transform: translateX(0) rotate(0) scale(1); }
        }

        @keyframes rotate-out {
            from { opacity: 1; transform: translateX(0) rotate(0) scale(1); }
            to { opacity: 0; transform: translateX(-50%) rotate(-12deg) scale(0.8); }
        }

        /* Estilo de los encabezados */
        .slide h1 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #000000;
        }

        /* Estilo de los párrafos */
        .slide p {
            font-size: 1.2em;
            color: #000000;
            padding: 0 20px;
        }

        /* Contenedor de los botones de navegación */
        .navigation {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        /* Estilo de los botones */
        .nav-btn {
            padding: 10px 20px;
            background-color: #007BFF;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }

        /* Cambio de color de botón en hover */
        .nav-btn:hover {
            background-color: #0056b3;
        }

        /* Media query para adaptar el contenedor a pantallas pequeñas */
        @media (max-width: 768px) {
            .container {
                max-width: 100%;
                max-height: 80%;
            }
            
            .slide h1 {
                font-size: 1.5em;
            }
            
            .slide p {
                font-size: 1em;
            }
            
            .nav-btn {
                padding: 8px 16px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <!-- Contenedor de partículas de fondo -->
    <div id="particles-js"></div>

    <!-- Contenedor principal para las láminas de la presentación -->
    <div class="container">
        <div id="slide-1" class="slide active">
            <img src="static/1.png" alt="">
        </div>
        <div id="slide-2" class="slide">
            <img src="static/2.png" alt="">
        </div>
        <div id="slide-3" class="slide">
            <img src="static/3.png" alt="">
        </div>
        <div id="slide-4" class="slide">
            <img src="static/4.png" alt="">
        </div>
    </div>

    <!-- Botones de navegación para avanzar y retroceder láminas -->
    <!--div class="navigation">
        <button class="nav-btn" onclick="previousSlide()">Anterior</button>
        <button class="nav-btn" onclick="nextSlide()">Siguiente</button>
    </ div-->

    <!-- Script de particles.js para crear el fondo animado -->
    <!--script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script-->
    <script src="particles.min.js"></script>
    <script>
        // Configuración de particles.js para el fondo de partículas animadas
        particlesJS("particles-js", {
            "particles": {
                "number": {
                    "value": 100,
                    "density": {
                        "enable": true,
                        "value_area": 800
                    }
                },
                "color": {
                    "value": "#000000"
                },
                "shape": {
                    "type": "circle"
                },
                "opacity": {
                    "value": 0.5
                },
                "size": {
                    "value": 3,
                    "random": true
                },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#000000",
                    "opacity": 0.4,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 3
                }
            },
            "interactivity": {
                "events": {
                    "onhover": {
                        "enable": true,
                        "mode": "repulse"
                    },
                    "onclick": {
                        "enable": true,
                        "mode": "push"
                    }
                }
            },
            "retina_detect": true
        });

        // Variables para controlar la lámina actual y el total de láminas
        let currentSlide = 1;
        const totalSlides = 4;
        const transitionEffects = ['slide', 'fade', 'zoom', 'vertical', 'rotate'];
        let previousEffect = null;
        let transitionTimeout;

        // Muestra la lámina especificada y oculta las demás
        function showSlide(slideNumber) {
            const slides = document.querySelectorAll('.slide');
            const outgoingSlide = document.querySelector('.slide.active');
            const incomingSlide = document.querySelector(`#slide-${slideNumber}`);
            const effectOptions = transitionEffects.filter(effect => effect !== previousEffect);
            const effect = effectOptions[Math.floor(Math.random() * effectOptions.length)];

            clearTimeout(transitionTimeout);
            slides.forEach(slide => {
                slide.classList.remove(
                    'transition-in',
                    'transition-out',
                    ...transitionEffects.map(name => `transition-${name}-in`),
                    ...transitionEffects.map(name => `transition-${name}-out`)
                );
            });

            outgoingSlide.classList.remove('active');
            outgoingSlide.classList.add('transition-out', `transition-${effect}-out`);
            incomingSlide.classList.add('active', 'transition-in', `transition-${effect}-in`);
            previousEffect = effect;

            // Limpia las clases de transición después de que la animación haya
            // terminado en un tiempo de 3.5 segundos (3500 ms)
            transitionTimeout = setTimeout(() => {
                outgoingSlide.classList.remove('transition-out', `transition-${effect}-out`);
                incomingSlide.classList.remove('transition-in', `transition-${effect}-in`);
            }, 500);
        }

        // Avanza a la siguiente lámina
        function nextSlide() {
            currentSlide = currentSlide < totalSlides ? currentSlide + 1 : 1;
            showSlide(currentSlide);
        }

        // Retrocede a la lámina anterior
        function previousSlide() {
            currentSlide = currentSlide > 1 ? currentSlide - 1 : totalSlides;
            showSlide(currentSlide);
        }

        // Controla las teclas de navegación del teclado
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowRight' || event.key === ' ' || event.key === 'Enter') {
                nextSlide(); // Flecha derecha, espacio y Enter avanzan a la siguiente lámina
                event.preventDefault();
            } else if (event.key === 'ArrowLeft') {
                previousSlide(); // Flecha izquierda retrocede a la lámina anterior
            }
        });
    </script>
</body>
</html>
