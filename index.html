<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación con fondo de partículas</title>
    <style>
        /* Estilos base para eliminar márgenes y configurar fuentes */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Configuración del cuerpo del documento */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #FFFFFF; /* Fondo blanco */
            overflow: hidden;
        }

        /* Contenedor del fondo de partículas */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1; /* Colocar el fondo detrás del contenido principal */
            background-color: #FFFFFF; /* Fondo blanco *//
        }

        /* Contenedor principal de la presentación */
        .container {
            position: relative;
            width: 1625px;
            height: 915px;
            max-width: 1800px;
            max-height: 1200px;
            overflow: hidden;
            border-radius: 8px;
            background-color: #FFFFFF;
            box-shadow: 0 5px 100px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }

        /* Configuración de las láminas individuales */
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            transition: left 0.5s ease-in-out;
        }

        /* Regla para adaptar la imagen de 1200x676px al contenedor */
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;     /* Ajusta la imagen completa sin deformarla ni recortarla */
        }

        /* Clase para la lámina activa */
        .slide.active {
            left: 0; /* Hace visible la lámina activa */
        }

        /* Estilo de los encabezados */
        .slide h1 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #000000;
        }

        /* Estilo de los párrafos */
        .slide p {
            font-size: 1.2em;
            color: #000000;
            padding: 0 20px;
        }

        /* Contenedor de los botones de navegación */
        .navigation {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        /* Estilo de los botones */
        .nav-btn {
            padding: 10px 20px;
            background-color: #007BFF;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }

        /* Cambio de color de botón en hover */
        .nav-btn:hover {
            background-color: #0056b3;
        }

        /* Media query para adaptar el contenedor a pantallas pequeñas */
        @media (max-width: 768px) {
            .container {
                max-width: 100%;
                max-height: 80%;
            }
            
            .slide h1 {
                font-size: 1.5em;
            }
            
            .slide p {
                font-size: 1em;
            }
            
            .nav-btn {
                padding: 8px 16px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <!-- Contenedor de partículas de fondo -->
    <div id="particles-js"></div>

    <!-- Contenedor principal para las láminas de la presentación -->
    <div class="container">
        <div id="slide-1" class="slide active">
            <img src="static/1.png" alt="">
        </div>
        <div id="slide-2" class="slide">
            <img src="static/2.png" alt="">
        </div>
        <div id="slide-3" class="slide">
            <img src="static/3.png" alt="">
        </div>
        <div id="slide-4" class="slide">
            <img src="static/4.png" alt="">
        </div>
    </div>

    <!-- Botones de navegación para avanzar y retroceder láminas -->
    <div class="navigation">
        <button class="nav-btn" onclick="previousSlide()">Anterior</button>
        <button class="nav-btn" onclick="nextSlide()">Siguiente</button>
    </div>

    <!-- Script de particles.js para crear el fondo animado -->
    <!--script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script-->
    <script src="particles.min.js"></script>
    <script>
        // Configuración de particles.js para el fondo de partículas animadas
        particlesJS("particles-js", {
            "particles": {
                "number": {
                    "value": 100,
                    "density": {
                        "enable": true,
                        "value_area": 800
                    }
                },
                "color": {
                    "value": "#000000"
                },
                "shape": {
                    "type": "circle"
                },
                "opacity": {
                    "value": 0.5
                },
                "size": {
                    "value": 3,
                    "random": true
                },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#000000",
                    "opacity": 0.4,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 3
                }
            },
            "interactivity": {
                "events": {
                    "onhover": {
                        "enable": true,
                        "mode": "repulse"
                    },
                    "onclick": {
                        "enable": true,
                        "mode": "push"
                    }
                }
            },
            "retina_detect": true
        });

        // Variables para controlar la lámina actual y el total de láminas
        let currentSlide = 1;
        const totalSlides = 4;

        // Muestra la lámina especificada y oculta las demás
        function showSlide(slideNumber) {
            document.querySelectorAll('.slide').forEach(slide => {
                slide.classList.remove('active');
            });
            document.querySelector(`#slide-${slideNumber}`).classList.add('active');
        }

        // Avanza a la siguiente lámina
        function nextSlide() {
            currentSlide = currentSlide < totalSlides ? currentSlide + 1 : 1;
            showSlide(currentSlide);
        }

        // Retrocede a la lámina anterior
        function previousSlide() {
            currentSlide = currentSlide > 1 ? currentSlide - 1 : totalSlides;
            showSlide(currentSlide);
        }

        // Controla las teclas de navegación del teclado
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowRight' || event.key === ' ' || event.key === 'Enter') {
                nextSlide(); // Flecha derecha, espacio y Enter avanzan a la siguiente lámina
                event.preventDefault();
            } else if (event.key === 'ArrowLeft') {
                previousSlide(); // Flecha izquierda retrocede a la lámina anterior
            }
        });
    </script>
</body>
</html>
